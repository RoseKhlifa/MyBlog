name: rosekhlifa-blog

services:
  blog:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    container_name: rosekhlifa-blog
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:18180:8080"
    volumes:
      - /opt/rosekhlifa-blog:/srv/blog:ro
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
