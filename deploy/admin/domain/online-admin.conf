# Managed blog editor routes; / continues using 1Panel's existing root.conf.
# The editor's BasicAuth applies to every upstream request, including source modules.
location = /admin { return 308 /admin/; }
location ^~ /admin/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location ^~ /api/admin/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location ^~ /_publish/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location ^~ /src/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location ^~ /node_modules/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location ^~ /@ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location = /site.config.mjs {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location = /_image {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location = /_image/ {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
location = /__vite_ping {
    include /www/sites/blog.rosekhlifa.com/proxy/online-admin-upstream.inc;
}
